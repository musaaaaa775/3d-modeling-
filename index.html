<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Workshop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080b12; color: #f1f5f9; font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .top-bar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 18px; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 12px;
    }
    .top-bar h1 { font-size: 1rem; letter-spacing: 0.08em; }
    .top-bar p { font-size: 0.85rem; color: #38bdf8; margin-top: 2px; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #1e293b; color: #f1f5f9; border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }
    button.active { border-color: #38bdf8; color: #38bdf8; }
    .project-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; padding: 10px; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 14px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <header class="top-bar">
    <div>
      <h1>3D WORKSHOP</h1>
      <p id="model-info">Orbital Rocket — Interactive 3D Viewport</p>
    </div>
    <div class="controls">
      <button id="wireframe-btn">Wireframe: OFF</button>
      <button id="spin-btn" class="active">Auto-Spin: ON</button>
    </div>
  </header>

  <nav class="project-bar">
    <button class="active" onclick="setModel('rocket', 'Orbital Rocket — Interactive 3D Viewport', this)">Rocket v1</button>
    <button onclick="setModel('satellite', 'CubeSat Probe — Orbital Module', this)">Satellite</button>
    <button onclick="setModel('capsule', 'Crew Capsule — Reentry Pod', this)">Capsule</button>
  </nav>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Build 3D Meshes (Vertices + Triangles)
    function buildRocket() {
      const verts = [], tris = [];
      const segs = 20;
      // Nose tip
      verts.push([0, 2.3, 0]); // 0
      // Upper body ring (y = 1.3, r = 0.45)
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        verts.push([Math.cos(a) * 0.45, 1.3, Math.sin(a) * 0.45]);
      }
      // Lower body ring (y = -1.2, r = 0.48)
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        verts.push([Math.cos(a) * 0.48, -1.2, Math.sin(a) * 0.48]);
      }
      // Engine nozzle ring (y = -1.65, r = 0.32)
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        verts.push([Math.cos(a) * 0.32, -1.65, Math.sin(a) * 0.32]);
      }
      for (let i = 0; i < segs; i++) {
        const next = (i + 1) % segs;
        const u1 = 1 + i, u2 = 1 + next;
        const l1 = 1 + segs + i, l2 = 1 + segs + next;
        const n1 = 1 + segs * 2 + i, n2 = 1 + segs * 2 + next;
        tris.push({ idx: [0, u2, u1], color: [56, 189, 248] }); // Blue nose
        tris.push({ idx: [u1, u2, l2], color: [226, 232, 240] }); // Silver hull
        tris.push({ idx: [u1, l2, l1], color: [226, 232, 240] });
        tris.push({ idx: [l1, l2, n2], color: [100, 116, 139] }); // Dark nozzle
        tris.push({ idx: [l1, n2, n1], color: [100, 116, 139] });
      }
      // 4 Stabilizer Fins
      for (let f = 0; f < 4; f++) {
        const a = (f * Math.PI) / 2;
        const cos = Math.cos(a), sin = Math.sin(a);
        const base = verts.length;
        verts.push([cos * 0.46, -0.3, sin * 0.46]);
        verts.push([cos * 1.05, -1.15, sin * 1.05]);
        verts.push([cos * 1.05, -1.45, sin * 1.05]);
        verts.push([cos * 0.48, -1.2, sin * 0.48]);
        tris.push({ idx: [base, base + 1, base + 2], color: [56, 189, 248] });
        tris.push({ idx: [base, base + 2, base + 3], color: [56, 189, 248] });
        tris.push({ idx: [base, base + 2, base + 1], color: [56, 189, 248] });
        tris.push({ idx: [base, base + 3, base + 2], color: [56, 189, 248] });
      }
      return { verts, tris };
    }

    function buildSatellite() {
      const verts = [
        [-0.6,-0.6,-0.6],[0.6,-0.6,-0.6],[0.6,0.6,-0.6],[-0.6,0.6,-0.6],
        [-0.6,-0.6,0.6],[0.6,-0.6,0.6],[0.6,0.6,0.6],[-0.6,0.6,0.6],
        // Left solar wing
        [-2.4,-0.35,0],[-0.7,-0.35,0],[-0.7,0.35,0],[-2.4,0.35,0],
        // Right solar wing
        [0.7,-0.35,0],[2.4,-0.35,0],[2.4,0.35,0],[0.7,0.35,0]
      ];
      const tris = [
        { idx:[0,1,2],color:[250,204,21] },{ idx:[0,2,3],color:[250,204,21] },
        { idx:[4,6,5],color:[250,204,21] },{ idx:[4,7,6],color:[250,204,21] },
        { idx:[0,4,5],color:[234,179,8] },{ idx:[0,5,1],color:[234,179,8] },
        { idx:[2,6,7],color:[234,179,8] },{ idx:[2,7,3],color:[234,179,8] },
        { idx:[1,5,6],color:[202,138,4] },{ idx:[1,6,2],color:[202,138,4] },
        { idx:[0,3,7],color:[202,138,4] },{ idx:[0,7,4],color:[202,138,4] },
        { idx:[8,9,10],color:[56,189,248] },{ idx:[8,10,11],color:[56,189,248] },
        { idx:[8,10,9],color:[56,189,248] },{ idx:[8,11,10],color:[56,189,248] },
        { idx:[12,13,14],color:[56,189,248] },{ idx:[12,14,15],color:[56,189,248] },
        { idx:[12,14,13],color:[56,189,248] },{ idx:[12,15,14],color:[56,189,248] }
      ];
      return { verts, tris };
    }

    function buildCapsule() {
      const verts = [[0, 1.4, 0], [0, -1.1, 0]], tris = [], segs = 20;
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        verts.push([Math.cos(a) * 0.55, 0.7, Math.sin(a) * 0.55]);
      }
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        verts.push([Math.cos(a) * 1.15, -0.7, Math.sin(a) * 1.15]);
      }
      for (let i = 0; i < segs; i++) {
        const n = (i + 1) % segs;
        const t1 = 2 + i, t2 = 2 + n, b1 = 2 + segs + i, b2 = 2 + segs + n;
        tris.push({ idx:[0,t2,t1], color:[148,163,184] });
        tris.push({ idx:[t1,t2,b2], color:[226,232,240] });
        tris.push({ idx:[t1,b2,b1], color:[226,232,240] });
        tris.push({ idx:[1,b1,b2], color:[249,115,22] }); // Heat shield
      }
      return { verts, tris };
    }

    const MODELS = { rocket: buildRocket(), satellite: buildSatellite(), capsule: buildCapsule() };
    let currentMesh = MODELS.rocket;
    let rotY = 0.5, rotX = 0.25, zoom = 1;
    let autoSpin = true, wireframe = false, dragging = false, lastX = 0, lastY = 0;

    window.setModel = (key, desc, btn) => {
      currentMesh = MODELS[key];
      document.getElementById('model-info').textContent = desc;
      document.querySelectorAll('.project-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('pointerup', () => dragging = false);
    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.012;
      rotX = Math.max(-1.3, Math.min(1.3, rotX + (e.clientY - lastY) * 0.012));
      lastX = e.clientX; lastY = e.clientY;
    });
    canvas.addEventListener('wheel', e => {
      zoom = Math.max(0.4, Math.min(2.5, zoom - e.deltaY * 0.001));
    });

    document.getElementById('wireframe-btn').onclick = e => {
      wireframe = !wireframe;
      e.target.textContent = 'Wireframe: ' + (wireframe ? 'ON' : 'OFF');
      e.target.classList.toggle('active', wireframe);
    };
    document.getElementById('spin-btn').onclick = e => {
      autoSpin = !autoSpin;
      e.target.textContent = 'Auto-Spin: ' + (autoSpin ? 'ON' : 'OFF');
      e.target.classList.toggle('active', autoSpin);
    };

    function project([x, y, z]) {
      // Rotate Y then X
      const cy = Math.cos(rotY), sy = Math.sin(rotY);
      const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
      const cx = Math.cos(rotX), sx = Math.sin(rotX);
      const y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
      const fov = Math.min(W, H) * 0.55 * zoom;
      const dist = 5.5 + z2;
      return { x: W / 2 + (x1 * fov) / dist, y: H / 2 - (y2 * fov) / dist, z: z2, v: [x1, y2, z2] };
    }

    function render() {
      ctx.fillStyle = '#080b12';
      ctx.fillRect(0, 0, W, H);

      if (autoSpin && !dragging) rotY += 0.012;

      // Draw 3D floor grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.lineWidth = 1;
      for (let g = -4; g <= 4; g++) {
        const a1 = project([g, -1.7, -4]), a2 = project([g, -1.7, 4]);
        const b1 = project([-4, -1.7, g]), b2 = project([4, -1.7, g]);
        ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      }

      const projVerts = currentMesh.verts.map(project);
      const renderTris = currentMesh.tris.map(t => {
        const p0 = projVerts[t.idx[0]], p1 = projVerts[t.idx[1]], p2 = projVerts[t.idx[2]];
        const ux = p1.v[0] - p0.v[0], uy = p1.v[1] - p0.v[1], uz = p1.v[2] - p0.v[2];
        const vx = p2.v[0] - p0.v[0], vy = p2.v[1] - p0.v[1], vz = p2.v[2] - p0.v[2];
        const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz) || 1;
        const light = Math.max(0.25, (nx / len) * 0.5 + (ny / len) * 0.6 - (nz / len) * 0.6);
